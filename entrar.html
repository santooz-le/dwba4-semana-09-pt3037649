<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Entrar - IFSP - Pirituba</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/conteudo.css" />
    <link rel="stylesheet" href="css/formularios.css" />
  </head>
  <body>
    <header id="cabecalho">
      <object width="100%" height="200px" data="menu.html"></object>
    </header>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-4 text-center">
          <img src="ifsp.png" class="mx-auto d-block mb-3" alt="IFSP Logo" style="max-height: 80px; width: auto;" />
          <h2 class="mb-4" style="font-weight: normal; font-size: 28px; color: #333;">Faça login</h2>
          
          <form method="POST">
            <div class="form-group mb-3">
              <input type="email" name="usuario" id="entrar-usuario" class="form-control" placeholder="Seu email" required style="height: 45px; font-size: 16px;" />
            </div>
            
            <div class="form-group mb-3">
              <input type="password" name="senha" id="entrar-senha" class="form-control" placeholder="Senha" required style="height: 45px; font-size: 16px;" />
            </div>
            
            <div class="form-check mb-3 d-flex justify-content-center align-items-center">
              <input type="checkbox" class="form-check-input" name="manterlogado" id="manterlogado" style="margin-top: 0; margin-right: 8px; position: static;" />
              <label class="form-check-label" for="manterlogado" style="font-size: 15px; color: #555; user-select: none;">Lembrar de mim</label>
            </div>
            
            <div class="mb-3 text-center">
              <a href="#" style="font-size: 15px; text-decoration: none; color: #007bff;">Esqueci a senha</a>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" style="height: 45px; font-size: 16px; background-color: #007bff; border-color: #007bff; font-weight: 500;">Login</button>
          </form>
        </div>
      </div>
    </main>

    <footer>
      <object width="100%" height="200px" data="rodape.html"></object>
    </footer>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
  </body>
</html>
